version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_parking_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - parking-net
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password123", "-Q", "SELECT 1", "-C" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: parking-api
    container_name: aspnet_parking_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ParkingDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
     db:
      condition: service_healthy
    networks:
      - parking-net

volumes:
  mssql_data:

networks:
  parking-net:
    driver: bridge